<!DOCTYPE HTML>
<html>
<head>

    <!-- CSS -->
    <link rel="stylesheet" href="/cssfiles/light-theme.css">
    <link rel="stylesheet" href="/cssfiles/dark-theme.css">
    <link rel="stylesheet" href="/cssfiles/liquid-glass-theme.css">
    <link rel="stylesheet" href="/cssfiles/custom-theme.css">

    <!-- Scripts -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/javascriptfiles/theme.js" defer></script>
    <script src="/javascriptfiles/auth.js" defer></script>
</head>
<body>
    <main>
        <div class="nav-upper">
        <a class="button_1" href="/">Homepage</a>
        </div>
        <h1>Authentification</h1>
        <form id="authForm">
            <input class="input-field" type="text" id="username" placeholder="Username" autocomplete="username">
            <input class="input-field" type="email" id="email" placeholder="Email" autocomplete="email" required>
            <input class="input-field" type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <button class="button_1" type="button" id="signUpButton">Sign Up</button>
            <button class="button_1" type="submit" id="signInButton">Sign In</button>
            <button class="button_1" type="button" id="signOutButton">Sign Out</button>
            <p id="authMessage" role="status" aria-live="polite"></p>
        </form>
    </main>
</body>
</html>
